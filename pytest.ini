; Configuration pytest de PicturIt.
;
; Les tests portent sur core/ (logique métier sans UI Qt). Aucun test ne crée
; de QApplication : ui/ et core/thumbnails.py sont hors périmètre du harnais.
;
; Lancement : .\.venv\Scripts\python.exe -m pytest

[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
